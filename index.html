<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billable Hours & Workload Planner</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #FFFFFF;
            --bg-secondary: #F8F9FA;
            --bg-tertiary: #E9ECEF;
            --accent-primary: #0078C8;
            --accent-secondary: #F58220;
            --accent-warning: #FDB913;
            --accent-danger: #DC3545;
            --accent-success: #28A745;
            --text-primary: #1A2B4A;
            --text-secondary: #495057;
            --text-muted: #6C757D;
            --border: #DEE2E6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .app-container {
            min-height: 100vh;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(0, 245, 212, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(0, 187, 249, 0.08) 0%, transparent 50%);
        }

        .header {
            background: linear-gradient(135deg, #1A2B4A 0%, #0078C8 100%);
            border-bottom: none;
            padding: 2rem 2rem 1.5rem;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            color: white;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
            font-weight: 500;
        }

        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .stat-card:hover::before {
            opacity: 1;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-primary);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 800;
            font-family: 'Inter', monospace;
            color: var(--accent-primary);
            line-height: 1;
        }

        .stat-unit {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-left: 0.5rem;
        }

        .stat-meta {
            margin-top: 0.75rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .section {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .btn {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95rem;
            letter-spacing: 0.02em;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 120, 200, 0.3);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--bg-primary);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: var(--bg-tertiary);
            padding: 1rem;
            text-align: left;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            border-bottom: 2px solid var(--border);
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
        }

        tr:hover {
            background: var(--bg-tertiary);
        }

        .month-name {
            font-weight: 700;
            color: var(--accent-primary);
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--bg-tertiary);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 0.5rem;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            transition: width 0.5s ease;
            border-radius: 10px;
        }

        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .status-ahead {
            background: rgba(0, 245, 212, 0.2);
            color: var(--accent-primary);
        }

        .status-behind {
            background: rgba(241, 91, 181, 0.2);
            color: var(--accent-danger);
        }

        .status-ontrack {
            background: rgba(254, 228, 64, 0.2);
            color: var(--accent-warning);
        }

        .time-off-list {
            display: grid;
            gap: 1rem;
        }

        .time-off-item {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem;
            display: grid;
            grid-template-columns: auto 1fr auto auto;
            gap: 1rem;
            align-items: center;
            transition: all 0.3s ease;
        }

        @media (max-width: 1024px) {
            .time-off-item {
                grid-template-columns: 1fr auto;
            }
        }

        .time-off-item:hover {
            border-color: var(--accent-primary);
            transform: translateX(4px);
        }

        .time-off-date {
            font-family: 'Inter', monospace;
            font-weight: 700;
            color: var(--accent-secondary);
            font-size: 0.9rem;
        }

        .time-off-type {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .type-holiday {
            background: rgba(0, 120, 200, 0.15);
            color: var(--accent-primary);
            border: 1px solid rgba(0, 120, 200, 0.3);
        }

        .type-vacation {
            background: rgba(245, 130, 32, 0.15);
            color: var(--accent-secondary);
            border: 1px solid rgba(245, 130, 32, 0.3);
        }

        .type-navy {
            background: rgba(253, 185, 19, 0.15);
            color: var(--accent-warning);
            border: 1px solid rgba(253, 185, 19, 0.3);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input, select {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(0, 245, 212, 0.1);
        }

        .delete-btn {
            background: var(--accent-danger);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .delete-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(241, 91, 181, 0.3);
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 14, 26, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2rem;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { 
                opacity: 0;
                transform: translateY(50px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .tabs {
            display: flex;
            gap: 1rem;
            border-bottom: 2px solid var(--border);
            margin-bottom: 2rem;
        }

        .tab {
            background: none;
            border: none;
            color: var(--text-secondary);
            padding: 1rem 1.5rem;
            cursor: pointer;
            font-weight: 600;
            position: relative;
            transition: all 0.3s ease;
        }

        .tab:hover {
            color: var(--text-primary);
        }

        .tab.active {
            color: var(--accent-primary);
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
        }

        @media (max-width: 768px) {
            .main-content {
                padding: 1rem;
            }

            h1 {
                font-size: 2rem;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .time-off-item {
                grid-template-columns: 1fr;
            }
        }
    </style>

    <!-- PWA / iOS home-screen support -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0078C8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Billable Planner">

</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function PTOPlanner() {
            const currentYear = 2026;
            const [annualTarget, setAnnualTarget] = useState(1920);
            const [showModal, setShowModal] = useState(false);
            const [showTargetModal, setShowTargetModal] = useState(false);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [editingEntry, setEditingEntry] = useState(null);
            const [settingsLocked, setSettingsLocked] = useState(() => {
                const saved = localStorage.getItem('settingsLocked');
                return saved ? JSON.parse(saved) : false;
            });
            const [showUnlockConfirm, setShowUnlockConfirm] = useState(false);

            const [monthlyHours, setMonthlyHours] = useState(() => {
                const saved = localStorage.getItem('monthlyHours');
                return saved ? JSON.parse(saved) : [
                    { month: 'Jan', required: 160, actual: 0 },
                    { month: 'Feb', required: 160, actual: 0 },
                    { month: 'Mar', required: 160, actual: 0 },
                    { month: 'Apr', required: 160, actual: 0 },
                    { month: 'May', required: 160, actual: 0 },
                    { month: 'Jun', required: 160, actual: 0 },
                    { month: 'Jul', required: 160, actual: 0 },
                    { month: 'Aug', required: 160, actual: 0 },
                    { month: 'Sep', required: 160, actual: 0 },
                    { month: 'Oct', required: 160, actual: 0 },
                    { month: 'Nov', required: 160, actual: 0 },
                    { month: 'Dec', required: 160, actual: 0 }
                ];
            });

            // Separate state for scenario planning
            const [scenarioTargets, setScenarioTargets] = useState(null);
            
            // Active monthly plan (separate from Settings baseline)
            const [activePlan, setActivePlan] = useState(() => {
                const saved = localStorage.getItem('activePlan');
                return saved ? JSON.parse(saved) : null;
            });

            const [timeOffEntries, setTimeOffEntries] = useState(() => {
                const saved = localStorage.getItem('timeOffEntries');
                return saved ? JSON.parse(saved) : [
                    { id: 1, startDate: '2026-01-01', endDate: '2026-01-01', type: 'Holiday', reason: "New Year's Day", hoursPerDay: 8 },
                    { id: 2, startDate: '2026-01-19', endDate: '2026-01-19', type: 'Holiday', reason: 'Martin Luther King Jr Day', hoursPerDay: 8 },
                    { id: 3, startDate: '2026-02-16', endDate: '2026-02-16', type: 'Holiday', reason: "President's Day", hoursPerDay: 8 },
                    { id: 4, startDate: '2026-05-25', endDate: '2026-05-25', type: 'Holiday', reason: 'Memorial Day', hoursPerDay: 8 },
                    { id: 5, startDate: '2026-07-03', endDate: '2026-07-03', type: 'Holiday', reason: 'Independence Day (observed)', hoursPerDay: 8 },
                    { id: 6, startDate: '2026-09-07', endDate: '2026-09-07', type: 'Holiday', reason: 'Labor Day', hoursPerDay: 8 },
                    { id: 7, startDate: '2026-11-26', endDate: '2026-11-26', type: 'Holiday', reason: 'Thanksgiving', hoursPerDay: 8 },
                    { id: 8, startDate: '2026-11-27', endDate: '2026-11-27', type: 'Holiday', reason: 'Day after Thanksgiving', hoursPerDay: 8 },
                    { id: 9, startDate: '2026-12-25', endDate: '2026-12-25', type: 'Holiday', reason: 'Christmas Day', hoursPerDay: 8 },
                    { id: 10, startDate: '2026-02-18', endDate: '2026-02-22', type: 'Navy', reason: 'NTCE1', hoursPerDay: 8 },
                    { id: 11, startDate: '2026-06-26', endDate: '2026-07-05', type: 'Vacation', reason: 'Cruise', hoursPerDay: 8 },
                    { id: 12, startDate: '2026-06-10', endDate: '2026-06-14', type: 'Vacation', reason: 'Family reunion', hoursPerDay: 8 },
                ];
            });

            const [newEntry, setNewEntry] = useState({
                startDate: '',
                endDate: '',
                type: 'Vacation',
                reason: '',
                hoursPerDay: 8
            });

            const [monthlyData, setMonthlyData] = useState([]);

            const calculateDays = (start, end) => {
                const startDate = new Date(start);
                const endDate = new Date(end);
                const diffTime = Math.abs(endDate - startDate);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
                return diffDays;
            };

            const formatDate = (dateString) => {
                const [year, month, day] = dateString.split('-');
                return `${month}/${day}/${year}`;
            };

            const getWorkingDays = (year, month) => {
                const date = new Date(year, month, 1);
                const lastDay = new Date(year, month + 1, 0).getDate();
                let workingDays = 0;

                for (let day = 1; day <= lastDay; day++) {
                    const currentDate = new Date(year, month, day);
                    const dayOfWeek = currentDate.getDay();
                    if (dayOfWeek !== 0 && dayOfWeek !== 6) {
                        workingDays++;
                    }
                }
                return workingDays;
            };

            const getTimeOffHoursForMonth = (monthIndex) => {
                let totalHours = 0;
                timeOffEntries.forEach(entry => {
                    const start = new Date(entry.startDate);
                    const end = new Date(entry.endDate);
                    
                    for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
                        if (d.getMonth() === monthIndex && d.getFullYear() === currentYear) {
                            totalHours += entry.hoursPerDay;
                        }
                    }
                });
                return totalHours;
            };

            useEffect(() => {
                const data = monthlyHours.map((m, index) => {
                    const workingDays = getWorkingDays(currentYear, index);
                    const timeOffHours = getTimeOffHoursForMonth(index);
                    const timeOffDays = timeOffHours / 8;
                    // Use active plan if available, otherwise use settings
                    const billableTarget = activePlan ? activePlan[index] : m.required;
                    const adjustedWorkingDays = workingDays - timeOffDays;
                    const dailyPace = adjustedWorkingDays > 0 ? billableTarget / adjustedWorkingDays : 0;
                    
                    // Calculate cumulative values using active plan or settings
                    const targets = activePlan || monthlyHours.map(m => m.required);
                    const cumulativeTarget = targets.slice(0, index + 1).reduce((sum, target) => sum + target, 0);
                    const cumulativeActual = monthlyHours.slice(0, index + 1).reduce((sum, month) => sum + month.actual, 0);
                    const variance = cumulativeActual - cumulativeTarget;

                    return {
                        month: m.month,
                        billableTarget,
                        actualHours: m.actual,
                        timeOffHours,
                        dailyPace,
                        workingDays,
                        required: m.required,
                        cumulativeTarget,
                        cumulativeActual,
                        variance
                    };
                });

                setMonthlyData(data);
            }, [timeOffEntries, monthlyHours, activePlan]);

            // Save to localStorage whenever data changes
            useEffect(() => {
                localStorage.setItem('monthlyHours', JSON.stringify(monthlyHours));
            }, [monthlyHours]);

            useEffect(() => {
                localStorage.setItem('timeOffEntries', JSON.stringify(timeOffEntries));
            }, [timeOffEntries]);

            useEffect(() => {
                localStorage.setItem('settingsLocked', JSON.stringify(settingsLocked));
            }, [settingsLocked]);

            useEffect(() => {
                if (activePlan) {
                    localStorage.setItem('activePlan', JSON.stringify(activePlan));
                }
            }, [activePlan]);

            const totalBillableTarget = monthlyData.reduce((sum, m) => sum + m.billableTarget, 0);
            const totalActualHours = monthlyData.reduce((sum, m) => sum + m.actualHours, 0);
            const totalTimeOff = monthlyData.reduce((sum, m) => sum + m.timeOffHours, 0);
            const totalTimeOffDays = totalTimeOff / 8;
            const averageDailyPace = monthlyData.length > 0 
                ? monthlyData.reduce((sum, m) => sum + m.dailyPace, 0) / monthlyData.length 
                : 0;
            const overallVariance = totalActualHours - totalBillableTarget;
            
            // Bonus calculations
            // Bonus calculation - prorated based on annual target
            const getBonusTier = (hours) => {
                // Use Settings tab total (not active plan) for bonus proration
                const settingsAnnualTarget = monthlyHours.reduce((sum, m) => sum + m.required, 0);
                
                // Prorate first bonus threshold based on annual target
                // Full-time (1920) = 2000 bonus threshold
                // Formula: firstBonus = (settingsAnnualTarget / 1920) * 2000
                const firstBonusThreshold = Math.round((settingsAnnualTarget / 1920) * 2000);
                
                if (hours < firstBonusThreshold) {
                    return { 
                        tier: 'None', 
                        nextBonus: firstBonusThreshold, 
                        hoursToNext: firstBonusThreshold - hours 
                    };
                }
                
                // After first bonus, each additional bonus is every 100 hours
                const bonusCount = Math.floor((hours - firstBonusThreshold) / 100) + 1;
                const nextBonusAt = firstBonusThreshold + (bonusCount * 100);
                
                return { 
                    tier: bonusCount, 
                    nextBonus: nextBonusAt, 
                    hoursToNext: nextBonusAt - hours,
                    firstThreshold: firstBonusThreshold
                };
            };
            
            const currentBonus = getBonusTier(totalActualHours);
            const projectedBonus = getBonusTier(totalBillableTarget);
            
            // Mid-year milestone (as of June 30)
            const midYearTarget = monthlyData.slice(0, 6).reduce((sum, m) => sum + m.billableTarget, 0);
            const midYearActual = monthlyData.slice(0, 6).reduce((sum, m) => sum + m.actualHours, 0);
            const midYearVariance = midYearActual - midYearTarget;

            const addTimeOffEntry = () => {
                if (newEntry.startDate && newEntry.endDate && newEntry.reason) {
                    if (editingEntry) {
                        // Update existing entry
                        setTimeOffEntries(timeOffEntries.map(e => 
                            e.id === editingEntry.id ? { ...newEntry, id: editingEntry.id } : e
                        ));
                        setEditingEntry(null);
                    } else {
                        // Add new entry
                        const entry = {
                            id: Date.now(),
                            ...newEntry
                        };
                        setTimeOffEntries([...timeOffEntries, entry]);
                    }
                    setNewEntry({
                        startDate: '',
                        endDate: '',
                        type: 'Vacation',
                        reason: '',
                        hoursPerDay: 8
                    });
                    setShowModal(false);
                }
            };

            const editEntry = (entry) => {
                setNewEntry({
                    startDate: entry.startDate,
                    endDate: entry.endDate,
                    type: entry.type,
                    reason: entry.reason,
                    hoursPerDay: entry.hoursPerDay
                });
                setEditingEntry(entry);
                setShowModal(true);
            };

            const deleteEntry = (id) => {
                setTimeOffEntries(timeOffEntries.filter(e => e.id !== id));
            };

            const updateMonthlyTarget = (monthIndex, newValue) => {
                const updated = [...monthlyHours];
                updated[monthIndex].required = parseFloat(newValue) || 0;
                setMonthlyHours(updated);
                // Update annual target to match sum of monthly targets
                const newAnnualTotal = updated.reduce((sum, m) => sum + m.required, 0);
                setAnnualTarget(newAnnualTotal);
            };

            const updateScenarioTarget = (monthIndex, newValue) => {
                // Initialize scenario targets if not set
                if (!scenarioTargets) {
                    // Use active plan if available, otherwise use settings

                                            <div key={index} className="form-group">
                                                <label>{m.month} Target</label>
                                                <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                                                    <input 
                                                        type="number" 
                                                        value={m.required}
                                                        onChange={(e) => updateMonthlyTarget(index, e.target.value)}
                                                        min="0"
                                                        step="1"
                                                        style={{ flex: 1 }}
                                                    />
                                                    <span style={{ color: 'var(--text-muted)', fontSize: '0.85rem', minWidth: '40px' }}>hrs</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    <div style={{ marginTop: '1.5rem', padding: '1rem', background: 'var(--bg-tertiary)', borderRadius: '12px' }}>
                                        <div className="stat-label">Total Annual from Monthly Targets</div>
                                        <div style={{ fontSize: '1.5rem', fontWeight: '700', color: 'var(--accent-primary)' }}>
                                            {monthlyHours.reduce((sum, m) => sum + m.required, 0)} hours
                                        </div>
                                    </div>
                                </div>

                                <div className="section">
                                    <div className="section-header">
                                        <h2>When to Adjust Monthly Targets</h2>
                                    </div>
                                    <div style={{ display: 'grid', gap: '1rem' }}>
                                        <div style={{ padding: '1rem', background: 'var(--bg-tertiary)', borderRadius: '12px' }}>
                                            <div style={{ fontWeight: '700', marginBottom: '0.5rem', color: 'var(--accent-danger)' }}>
                                                FMLA Leave (Family & Medical Leave Act)
                                            </div>
                                            <p style={{ color: 'var(--text-secondary)', fontSize: '0.9rem' }}>
                                                For qualifying FMLA leave (up to 12 weeks for family/medical reasons), reduce or zero out affected months. 
                                                Adjust each month proportionally based on actual leave taken.
                                                <strong style={{ color: 'var(--accent-danger)', display: 'block', marginTop: '0.5rem' }}>
                                                    ⚠️ Requires HR approval and proper FMLA documentation.
                                                </strong>
                                            </p>
                                        </div>
                                        <div style={{ padding: '1rem', background: 'var(--bg-tertiary)', borderRadius: '12px' }}>
                                            <div style={{ fontWeight: '700', marginBottom: '0.5rem', color: 'var(--accent-secondary)' }}>
                                                Maternity/Paternity Leave
                                            </div>
                                            <p style={{ color: 'var(--text-secondary)', fontSize: '0.9rem' }}>
                                                Reduce or zero out the affected months. For 12-week leave spanning 3 months, 
                                                adjust each month proportionally (e.g., full month = 0 hrs, partial months = reduced).
                                                <strong style={{ color: 'var(--accent-danger)', display: 'block', marginTop: '0.5rem' }}>
                                                    Requires HR approval and FMLA/leave documentation.
                                                </strong>
                                            </p>
                                        </div>
                                        <div style={{ padding: '1rem', background: 'var(--bg-tertiary)', borderRadius: '12px' }}>
                                            <div style={{ fontWeight: '700', marginBottom: '0.5rem', color: 'var(--accent-primary)' }}>
                                                Military Leave (2+ weeks)
                                            </div>
                                            <p style={{ color: 'var(--text-secondary)', fontSize: '0.9rem' }}>
                                                Set the affected month(s) to 0 or reduced hours (e.g., 80 hrs for 2-week absence). 
                                                Add the leave to your Time Off Schedule with type "Navy" or "Military".
                                                <strong style={{ color: 'var(--accent-danger)', display: 'block', marginTop: '0.5rem' }}>
                                                    Requires HR approval and documentation.
                                                </strong>
                                            </p>
                                        </div>
                                        <div style={{ padding: '1rem', background: 'var(--bg-tertiary)', borderRadius: '12px' }}>
                                            <div style={{ fontWeight: '700', marginBottom: '0.5rem', color: 'var(--accent-warning)' }}>
                                                Disability/Medical Leave
                                            </div>
                                            <p style={{ color: 'var(--text-secondary)', fontSize: '0.9rem' }}>
                                                For short-term or long-term disability leave, reduce targets for affected months proportionally. 
                                                May be covered under FMLA, ADA, or state disability programs.
                                                <strong style={{ color: 'var(--accent-danger)', display: 'block', marginTop: '0.5rem' }}>
                                                    Requires HR approval and medical documentation.
                                                </strong>
                                            </p>
                                        </div>
                                        <div style={{ padding: '1rem', background: 'var(--bg-tertiary)', borderRadius: '12px' }}>
                                            <div style={{ fontWeight: '700', marginBottom: '0.5rem', color: 'var(--accent-warning)' }}>
                                                Late Start / Mid-Year Hire
                                            </div>
                                            <p style={{ color: 'var(--text-secondary)', fontSize: '0.9rem' }}>
                                                Set months before start date to 0 hours. Adjust the start month proportionally 
                                                (e.g., started mid-month = 80 hrs instead of 160 hrs).
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            </>
                        )}
                    </div>

                    {showUnlockConfirm && (
                        <div className="modal" onClick={() => setShowUnlockConfirm(false)}>
                            <div className="modal-content" onClick={(e) => e.stopPropagation()} style={{ maxWidth: '500px' }}>
                                <div className="modal-header">
                                    <h2>Unlock Settings</h2>
                                    <button className="close-btn" onClick={() => setShowUnlockConfirm(false)}>×</button>
                                </div>
                                <div style={{ padding: '1rem 0' }}>
                                    <p style={{ color: 'var(--text-secondary)', marginBottom: '1.5rem' }}>
                                        Settings should only be modified by HR or with HR approval. Annual targets are typically set once at the beginning of the year.
                                    </p>
                                    <p style={{ color: 'var(--accent-warning)', fontWeight: '600', marginBottom: '1.5rem' }}>
                                        ⚠️ Are you authorized to unlock and modify these settings?
                                    </p>
                                </div>
                                <div style={{ display: 'flex', gap: '1rem' }}>
                                    <button 
                                        className="btn" 
                                        onClick={() => {
                                            setSettingsLocked(false);
                                            setShowUnlockConfirm(false);
                                        }} 
                                        style={{ flex: 1 }}
                                    >
                                        Yes, Unlock Settings
                                    </button>
                                    <button 
                                        className="btn btn-secondary" 
                                        onClick={() => setShowUnlockConfirm(false)}
                                        style={{ flex: 1 }}
                                    >
                                        Cancel
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showModal && (
                        <div className="modal" onClick={() => setShowModal(false)}>
                            <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                                <div className="modal-header">
                                    <h2>{editingEntry ? 'Edit Time Off' : 'Add Time Off'}</h2>
                                    <button className="close-btn" onClick={() => {
                                        setShowModal(false);
                                        setEditingEntry(null);
                                        setNewEntry({
                                            startDate: '',
                                            endDate: '',
                                            type: 'Vacation',
                                            reason: '',
                                            hoursPerDay: 8
                                        });
                                    }}>×</button>
                                </div>
                                <div className="form-grid">
                                    <div className="form-group">
                                        <label>Start Date</label>
                                        <input 
                                            type="date" 
                                            value={newEntry.startDate}
                                            onChange={(e) => setNewEntry({...newEntry, startDate: e.target.value})}
                                        />
                                    </div>
                                    <div className="form-group">
                                        <label>End Date</label>
                                        <input 
                                            type="date" 
                                            value={newEntry.endDate}
                                            onChange={(e) => setNewEntry({...newEntry, endDate: e.target.value})}
                                        />
                                    </div>
                                </div>
                                <div className="form-grid">
                                    <div className="form-group">
                                        <label>Type</label>
                                        <select 
                                            value={newEntry.type}
                                            onChange={(e) => setNewEntry({...newEntry, type: e.target.value})}
                                        >
                                            <option value="Vacation">Vacation</option>
                                            <option value="Holiday">Holiday</option>
                                            <option value="Navy">Navy</option>
                                            <option value="Sick">Sick Leave</option>
                                            <option value="Personal">Personal</option>
                                        </select>
                                    </div>
                                    <div className="form-group">
                                        <label>Hours per Day</label>
                                        <input 
                                            type="number" 
                                            value={newEntry.hoursPerDay}
                                            onChange={(e) => setNewEntry({...newEntry, hoursPerDay: parseFloat(e.target.value)})}
                                            min="0"
                                            max="24"
                                            step="0.5"
                                        />
                                    </div>
                                </div>
                                <div className="form-group">
                                    <label>Reason / Description</label>
                                    <input 
                                        type="text" 
                                        value={newEntry.reason}
                                        onChange={(e) => setNewEntry({...newEntry, reason: e.target.value})}
                                        placeholder="e.g., Family vacation, Christmas holiday"
                                    />
                                </div>
                                <div style={{ display: 'flex', gap: '1rem', marginTop: '1.5rem' }}>
                                    <button className="btn" onClick={addTimeOffEntry} style={{ flex: 1 }}>
                                        {editingEntry ? 'Update Entry' : 'Add Entry'}
                                    </button>
                                    <button className="btn btn-secondary" onClick={() => {
                                        setShowModal(false);
                                        setEditingEntry(null);
                                        setNewEntry({
                                            startDate: '',
                                            endDate: '',
                                            type: 'Vacation',
                                            reason: '',
                                            hoursPerDay: 8
                                        });
                                    }}>
                                        Cancel
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<PTOPlanner />, document.getElementById('root'));
    </script>

    <script>
      // Register service worker for offline-ish support
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./service-worker.js').catch(() => {});
        });
      }
    </script>

</body>
</html>
